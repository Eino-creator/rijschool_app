type User @table {
  firebaseUid: String! @unique
  name: String!
  email: String!
  role: String!
}

type Lesson @table {
  date: Timestamp!
  endDate: Timestamp!
  status: String!
  paymentStatus: String!
  cost: Float!
  notes: String
  pupil: User!
  serviceRate: ServiceRate
}

type CourseCost @table {
  lesson_time: Int
  lesson_price: Float
  registrationFee: Float
  selfDeclaration: Float
  brokerageFees: Float
  ExamCarUsage: Float
  totalFirstExamQuestion: Float
  totalPracticalCatB: Float
}
