type User @table {
  firebaseUid: String! @unique
  name: String!
  email: String!
  role: String!
}

type Lesson @table {
  date: Timestamp!
  endDate: Timestamp!
  status: String!
  paymentStatus: String!
  cost: Float!
  notes: String
  pupil: User!
}

type CourseCost @table {
  instructor: User!
  lessonTime: Int
  lessonPrice: Float
  registrationFee: Float
  selfDeclaration: Float
  brokerageFees: Float
  examCarUsage: Float
}
