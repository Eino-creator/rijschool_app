mutation CreateUserProfile(
    $name: String!
    $email: String!
) @auth(level: USER) {
    user_insert(
        data: {
            firebaseUid_expr: "auth.uid"
            name: $name
            email: $email
            role: "PUPIL"
        }
    )
}

query GetMyRole($firebaseUid: String!) @auth(level: USER) {
    users(where: { firebaseUid: { eq: $firebaseUid } }) {
        role
    }
}

query GetMyUserId($firebaseUid: String!) @auth(level: USER) {
    users(where: { firebaseUid: { eq: $firebaseUid } }) {
        id
    }
}
