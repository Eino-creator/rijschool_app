query GetLesson(
  $id: UUID!
) @auth(level: USER) {
  lessons(where: {id: { eq: $id} }) {
    id
    date
    endDate
    status
    paymentStatus
    cost
    notes
    pupil {
      id
      name
    }
  }
}

query GetLessonsByDay(
  $startDate: Timestamp!
  $endDate: Timestamp!
) @auth(level: USER) {
  lessons(
    where: {
      date: {
        gt: $startDate
        lt: $endDate
      }
    }
  ) {
    id
    date
    endDate
    status
    paymentStatus
    cost
    notes
    pupil {
      id
      name
    }
  }
}

mutation CreateLesson(
  $date: Timestamp!
  $endDate: Timestamp!
  $status: String!
  $paymentStatus: String!
  $cost: Float!
  $notes: String
  $pupilId: UUID!
) @auth(level: USER) {
  lesson_insert(
    data: {
      date: $date
      endDate: $endDate
      status: $status
      paymentStatus: $paymentStatus
      cost: $cost
      notes: $notes
      pupilId: $pupilId
    }
  )
}
